name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            python: .venv/bin/python
          - os: windows-2022
            platform: windows-x64
            python: .venv/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install build tools
        shell: bash
        run: |
          python -m venv .venv
          ${{ matrix.python }} -m pip install -r requirements-build.txt
          ${{ matrix.python }} -c "import os; from monitor_switch.version import VERSION; assert os.environ['GITHUB_REF_NAME'] == 'v'+VERSION"
      - name: Build Mac helper
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/setup-mac.sh
      - name: Test without hardware writes
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ${{ matrix.python }} -m unittest discover -s tests -q
      - name: Build and smoke-test the package
        shell: bash
        run: |
          ${{ matrix.python }} scripts/build.py
          ${{ matrix.python }} scripts/smoke_package.py
          ${{ matrix.python }} scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: release-assets/*.zip
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: release-assets
          merge-multiple: true
      - run: python -m pip install cryptography==50.0.2 certifi==2026.10.23
      - name: Sign release metadata
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python scripts/sign_release.py release-assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
